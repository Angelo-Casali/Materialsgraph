name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Install only what the tests import (skips torch / sentence-transformers / mp-api).
      - run: |
          pip install -e . --no-deps
          pip install pymatgen neo4j pydantic python-dotenv requests openai anthropic langgraph pytest ruff fastapi httpx
      - run: ruff check src tests api scripts
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build   # type-check + build + performance budget
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-screenshots
          path: web/test-results/screenshots
          if-no-files-found: ignore
