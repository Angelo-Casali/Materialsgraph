name: Keep the free database awake

# AuraDB Free pauses after a few days without activity. A daily read keeps the demo responsive.
# Note: GitHub disables scheduled workflows after 60 days without repository activity; the site
# still works from its static snapshot when that happens.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    if: ${{ vars.API_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 "${{ vars.API_URL }}/api/health?deep=1"
